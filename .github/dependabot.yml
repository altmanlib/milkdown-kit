version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      # All @milkdown/* packages must stay on the same version.
      milkdown:
        patterns: ['@milkdown/*']
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*']
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 lacks the compiler API that vue-tsc needs.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
